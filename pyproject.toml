[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-3d-simulator"
version = "0.1.0"
description = "Python 3D construction sequence simulator for top-down projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dash>=2.18,<4",
  "plotly>=5.24,<7",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
construction-sim = "construction_sim.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

